<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ลงเวลาเข้างาน — Kornwat Garden Resort</title>

<link rel="icon" type="image/png" sizes="32x32" href="clock-favicon-32.png">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'Sarabun',sans-serif;}
body{background:#fef9e7;min-height:100dvh;display:flex;flex-direction:column;color:#3d2914;}

/* HEADER */
#hdr{background:#e07b54;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25);}
#hdr h1{flex:1;font-size:15px;font-weight:700;line-height:1.2;}
#hdr h1 small{display:block;font-size:11px;font-weight:400;opacity:.9;}
#hdr button{background:rgba(255,255,255,.22);border:none;color:#fff;padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:600;}
#hdr button:active{background:rgba(255,255,255,.4);}

/* LOGIN */
#login{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:340px;box-shadow:0 4px 12px rgba(0,0,0,.12);}
.login-box h2{color:#c44a1f;font-size:18px;text-align:center;margin-bottom:6px;}
.login-box p{color:#8b4513;font-size:12px;text-align:center;margin-bottom:18px;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:12px;color:#8b4513;margin-bottom:5px;font-weight:600;}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid #f4b8a0;border-radius:7px;font-size:14px;font-family:'Sarabun',sans-serif;background:#fef9e7;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:2px solid #e07b54;border-color:#e07b54;}
.btn-pri{background:#e07b54;color:#fff;padding:11px;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif;}
.btn-pri:active{background:#c44a1f;}
.btn-sec{background:#e0e0e0;color:#333;padding:9px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:'Sarabun',sans-serif;font-weight:600;}
.btn-pri.wide,.btn-sec.wide{width:100%;}

/* MAIN */
#main{flex:1;padding:12px;display:none;}
#date-bar{background:#fff;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.nav-arr{background:#fef0e0;border:1px solid #e07b54;color:#e07b54;width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;font-weight:700;}
.nav-arr:active{background:#e07b54;color:#fff;}
#date-mid{flex:1;text-align:center;font-size:14px;font-weight:700;color:#c44a1f;cursor:pointer;}
#date-sub{font-size:11px;color:#888;display:block;font-weight:400;}
#date-picker{position:absolute;opacity:0;pointer-events:none;width:0;height:0;}

.action-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:10px;}
.action-row button{background:#fef0e0;color:#c44a1f;border:1px solid #e07b54;padding:9px 4px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.3;}
.action-row button:active,.action-row button.active{background:#e07b54;color:#fff;}
.action-row button.line-btn{background:#06c755;color:#fff;border-color:#06c755;}
.action-row button.line-btn:active{background:#05a043;}
.action-row button.rep-btn{background:#1565c0;color:#fff;border-color:#1565c0;}
.action-row button.rep-btn:active{background:#0d47a1;}

/* REPORT */
#report-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:none;align-items:flex-start;justify-content:center;padding:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#report-modal.show{display:flex;}
#report-box{background:#fff;border-radius:12px;width:100%;max-width:780px;display:flex;flex-direction:column;overflow:hidden;}
#report-hd{background:#1565c0;color:#fff;padding:12px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-shrink:0;}
#report-hd h2{flex:1;font-size:15px;}
#report-cl{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
#report-bd{padding:14px;overflow-y:auto;flex:1;}
#report-ft{padding:10px 14px;display:flex;gap:8px;border-top:1px solid #e0e0e0;flex-wrap:wrap;}
.rep-filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:12px;}
.rep-filter label{font-size:12px;color:#1565c0;font-weight:700;}
.rep-filter input,.rep-filter select{padding:7px 9px;border:1px solid #b3d4f5;border-radius:6px;font-size:13px;font-family:'Sarabun',sans-serif;background:#f8fbff;}
.rep-card{border:1px solid #d0d7e0;border-radius:8px;padding:14px;background:#fff;}
.rep-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;border-bottom:2px solid #1565c0;padding-bottom:10px;}
.rep-title{font-size:16px;font-weight:800;color:#1565c0;}
.rep-meta{font-size:12px;color:#333;line-height:1.6;margin-top:4px;}
.rep-meta strong{color:#1565c0;}
.rep-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.rep-tbl th{background:#fef9c4;color:#5d4037;padding:6px 4px;border:1px solid #d0d0d0;text-align:center;font-weight:700;}
.rep-tbl td{padding:5px 4px;border:1px solid #e0e0e0;text-align:center;}
.rep-tbl tr.off-row td{background:#fef5f5;color:#888;}
.rep-tbl tr.has-entry td{background:#f0fdf4;}
.rep-tbl tr:hover{background:#fef9e7;cursor:pointer;}
.rep-tbl tfoot td{background:#fef0e0;font-weight:700;color:#c44a1f;}
.rep-tbl td.date-cell{text-align:left;padding-left:8px;font-weight:600;white-space:nowrap;}
.rep-tbl td.note-cell{text-align:left;font-size:10px;color:#666;}
.rep-summary{display:flex;gap:14px;margin-top:14px;padding:10px;background:#e8f4fd;border-radius:6px;flex-wrap:wrap;}
.rep-summary div{flex:1;text-align:center;min-width:100px;}
.rep-summary div span{font-size:11px;color:#666;display:block;}
.rep-summary div strong{font-size:16px;color:#1565c0;}

#mode-banner{background:#fde8d8;color:#8b4513;padding:7px 12px;border-radius:6px;font-size:12px;text-align:center;margin-bottom:10px;font-weight:600;}
#mode-banner.record-mode{background:#fff3c4;color:#7a5d20;}

.section-hd{background:#fde8d8;padding:8px 12px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;color:#8b4513;}
.emp-card{background:#fff;padding:12px;border-bottom:1px solid #fde8d8;display:flex;align-items:center;gap:10px;}
.emp-card:last-child{border-radius:0 0 8px 8px;border-bottom:none;}
.emp-card.has-entry{background:#f0fdf4;}
.emp-card.off{background:#fafafa;opacity:.7;}
.emp-info{flex:1;min-width:0;}
.emp-name{font-size:14px;font-weight:700;color:#c44a1f;line-height:1.2;}
.emp-pos{font-size:11px;color:#888;display:block;margin-top:2px;}
.emp-time{font-size:11px;color:#666;display:block;margin-top:3px;}
.emp-time .start-time{display:inline-block;background:#fef3c0;color:#7a5d20;padding:2px 8px;border-radius:10px;font-weight:700;font-size:11px;}
.emp-time .ot-tag{display:inline-block;background:#fcd34d;color:#7c2d12;padding:2px 8px;border-radius:10px;font-weight:700;font-size:10px;margin-left:4px;}
.emp-time .work-tag{display:inline-block;background:#d5edd8;color:#2e7d32;padding:2px 8px;border-radius:10px;font-weight:700;font-size:10px;margin-right:4px;}
.emp-action{flex-shrink:0;}
.emp-action button{background:#e07b54;color:#fff;border:none;padding:7px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700;}
.emp-action button.set{background:#fef0e0;color:#c44a1f;border:1px solid #e07b54;}
.emp-action button:active{background:#c44a1f;color:#fff;}

.state-badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700;margin-left:4px;}
.state-W{background:#d5edd8;color:#2e7d32;}
.state-HALF{background:#fef3c0;color:#d97706;}
.state-OFF{background:#e74c3c;color:#fff;}
.state-REQ_OFF{background:#fcd34d;color:#7c2d12;}

/* TIME PICKER (hour + minute selects) */
.time-picker{display:flex;gap:6px;align-items:center;}
.time-picker select{flex:1;padding:10px 6px;border:1px solid #f4b8a0;border-radius:7px;font-size:16px;font-weight:700;text-align:center;font-family:'Sarabun',sans-serif;background:#fffdf5;color:#c44a1f;}
.time-picker .colon{font-size:18px;font-weight:800;color:#c44a1f;}

/* PERIOD LIST in record modal */
.period-row{display:flex;align-items:center;gap:6px;padding:8px;background:#fef0e0;border-radius:8px;margin-bottom:8px;}
.period-row .label{font-size:11px;color:#8b4513;font-weight:700;min-width:48px;}
.period-row .time-picker{flex:1;}
.period-row .del-btn{background:#ffebee;color:#c62828;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;flex-shrink:0;}
.period-row .del-btn:active{background:#c62828;color:#fff;}
.period-stats{background:#e8f5e9;padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13px;color:#2e7d32;display:flex;justify-content:space-between;}
.period-stats strong{font-size:15px;}
.period-stats .ot{color:#d97706;}

.add-period-btn{width:100%;background:#fef0e0;color:#c44a1f;border:2px dashed #e07b54;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px;}
.add-period-btn:active{background:#e07b54;color:#fff;}

/* MODAL */
#modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
#modal-ov.show{display:flex;}
#modal-box{background:#fff;border-radius:12px;width:100%;max-width:380px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column;}
#modal-hd{background:#e07b54;color:#fff;padding:12px 16px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
#modal-cl{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;}
#modal-bd{padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#modal-ft{padding:10px 14px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid #fde8d8;flex-wrap:wrap;}

/* TOAST */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:200;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
#toast.hidden{opacity:0;}

/* LINE MESSAGE */
#line-textarea{width:100%;min-height:220px;padding:12px;border:2px solid #06c755;border-radius:8px;font-size:13px;line-height:1.7;color:#3d2914;font-family:'Sarabun',sans-serif;background:#fef9e7;resize:vertical;}
#line-textarea:focus{outline:none;border-color:#05a043;}
</style>
</head>
<body>

<div id="hdr">
  <h1>⏰ ลงเวลาเข้างาน<small id="recorder-name"></small></h1>
  <button id="btn-logout" onclick="logout()" style="display:none;">ออกจากระบบ</button>
</div>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h2>🌿 Kornwat Garden Resort</h2>
    <p>ลงชื่อเข้าใช้ผู้บันทึกเวลา</p>
    <div class="fg">
      <label>ชื่อผู้บันทึก</label>
      <select id="login-name"><option value="">-- กำลังโหลด... --</option></select>
    </div>
    <div class="fg">
      <label>PIN</label>
      <input type="number" id="login-pin" maxlength="6" placeholder="ตัวเลข 4-6 หลัก" autocomplete="off">
    </div>
    <button class="btn-pri wide" onclick="doLogin()">เข้าสู่ระบบ</button>
    <p style="text-align:center;font-size:11px;color:#aaa;margin-top:12px;">หาก PIN หาย → แจ้งเจ้าของเพื่อรีเซ็ต</p>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="date-bar">
    <button class="nav-arr" onclick="shiftDate(-1)">◀</button>
    <div id="date-mid" onclick="openDatePicker()">
      <span id="date-label">—</span>
      <span id="date-sub">—</span>
    </div>
    <input type="date" id="date-picker" onchange="onDatePicked()">
    <button class="nav-arr" onclick="shiftDate(1)">▶</button>
  </div>

  <div class="action-row" style="grid-template-columns:1fr 1fr 1fr;">
    <button onclick="goToday()">📅 วันนี้</button>
    <button id="btn-mode" onclick="toggleMode()">📋 ลงเวลาทำงาน</button>
    <button onclick="goTomorrow()">⏭ พรุ่งนี้</button>
  </div>
  <div class="action-row" style="grid-template-columns:1fr 1fr;margin-top:6px;">
    <button class="line-btn" onclick="showLineMessage()">💬 Line</button>
    <button class="rep-btn" onclick="openReportModal()">📊 รายงาน</button>
  </div>

  <div id="mode-banner">🕘 โหมด: <strong>กำหนดเวลาเข้างาน</strong> (สำหรับข้อความ Line)</div>

  <div id="emp-section"></div>
</div>

<div id="modal-ov">
  <div id="modal-box">
    <div id="modal-hd"><span id="modal-title"></span><button id="modal-cl" onclick="closeModal()">×</button></div>
    <div id="modal-bd"></div>
    <div id="modal-ft"></div>
  </div>
</div>

<!-- REPORT MODAL (separate from main modal) -->
<div id="report-modal">
  <div id="report-box">
    <div id="report-hd">
      <h2>📊 รายงานสรุปเวลาเข้าออกประจำวัน</h2>
      <button id="report-cl" onclick="closeReportModal()">×</button>
    </div>
    <div id="report-bd"></div>
    <div id="report-ft">
      <button class="btn-sec" onclick="closeReportModal()">ปิด</button>
      <button class="btn-pri" style="background:#1565c0;flex:1;" onclick="exportReportPNG()">📷 บันทึกรูป</button>
      <button class="btn-pri" style="background:#1565c0;flex:1;" onclick="exportReportPDF()">📄 บันทึก PDF</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
// ═══════════════ CONST + CLOUD ═══════════════
const SB_URL = 'https://xlsbabusatrlfolkrjmv.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhsc2JhYnVzYXRybGZvbGtyam12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTQyNzMsImV4cCI6MjA5MjUzMDI3M30.o8VJdMx6RFqOb1X96iJGey-NlHyx6KNFwLkYdq3_YU0';

const MONTH_TH = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const DAY_TH_FULL = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

async function sbFetch(method, path, body, extraHeaders){
  const headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer '+SB_KEY,
    'Content-Type': 'application/json',
    'Prefer': method==='POST'?'return=representation':'',
  };
  if(extraHeaders) Object.assign(headers, extraHeaders);
  const res = await fetch(SB_URL+'/rest/v1/'+path, {method, headers, body: body?JSON.stringify(body):undefined});
  if(!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

async function sha256Hex(str){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const beYearShort = y => String(y+543).slice(-2);

// ═══════════════ STATE ═══════════════
let recorderName = '';
let curDate = new Date();
let monthData = null;
let timeEntriesForMonth = {}; // emp|day -> entry
let mode = 'assign'; // 'assign' or 'record'

// ═══════════════ AUTH ═══════════════
async function init(){
  const saved = sessionStorage.getItem('clock_recorder');
  if(saved){
    try{
      const j = JSON.parse(saved);
      if(j.name && j.expires > Date.now()){
        recorderName = j.name;
        showMain(); return;
      }
    }catch{}
  }
  showLogin();
}

async function showLogin(){
  document.getElementById('login').style.display='flex';
  document.getElementById('main').style.display='none';
  document.getElementById('btn-logout').style.display='none';
  document.getElementById('recorder-name').textContent='';
  try{
    const rows = await sbFetch('GET','recorder_pins?select=name&order=name.asc');
    const sel = document.getElementById('login-name');
    sel.innerHTML = '<option value="">-- เลือกชื่อ --</option>' +
      rows.map(r=>`<option value="${esc(r.name)}">${esc(r.name)}</option>`).join('');
  }catch(e){ console.error(e); showToast('โหลดรายชื่อไม่ได้'); }
}

async function doLogin(){
  const name = document.getElementById('login-name').value;
  const pin = document.getElementById('login-pin').value.trim();
  if(!name){ alert('เลือกชื่อก่อน'); return; }
  if(!pin){ alert('ใส่ PIN'); return; }
  try{
    const rows = await sbFetch('GET',`recorder_pins?name=eq.${encodeURIComponent(name)}&select=pin_hash`);
    if(!rows.length){ alert('ไม่พบผู้ใช้นี้'); return; }
    const hash = await sha256Hex(pin);
    if(hash !== rows[0].pin_hash){ alert('PIN ไม่ถูกต้อง'); return; }
    recorderName = name;
    sessionStorage.setItem('clock_recorder', JSON.stringify({name, expires: Date.now()+30*24*3600*1000}));
    showMain();
  }catch(e){ console.error(e); showToast('เข้าสู่ระบบไม่สำเร็จ'); }
}

function logout(){
  sessionStorage.removeItem('clock_recorder');
  recorderName = '';
  showLogin();
}

async function showMain(){
  document.getElementById('login').style.display='none';
  document.getElementById('main').style.display='block';
  document.getElementById('btn-logout').style.display='inline-block';
  document.getElementById('recorder-name').textContent=`ผู้บันทึก: ${recorderName}`;
  await loadDate(curDate);
}

// ═══════════════ DATE NAV ═══════════════
function dateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function fmtDateLabel(d){
  const dow = DAY_TH_FULL[d.getDay()];
  return `${dow} ${d.getDate()} ${MONTH_TH[d.getMonth()+1]} ${d.getFullYear()+543}`;
}
function fmtDateSub(d){
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${beYearShort(d.getFullYear())}`;
}
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function shiftDate(delta){
  const d = new Date(curDate);
  d.setDate(d.getDate()+delta);
  await loadDate(d);
}
async function goToday(){ await loadDate(new Date()); }
async function goTomorrow(){
  const d = new Date(); d.setDate(d.getDate()+1);
  await loadDate(d);
}
function openDatePicker(){
  const p = document.getElementById('date-picker');
  p.value = isoDate(curDate);
  p.style.pointerEvents='auto';
  if(p.showPicker) p.showPicker();
  else p.click();
}
async function onDatePicked(){
  const v = document.getElementById('date-picker').value;
  if(!v) return;
  const [y,m,d] = v.split('-').map(Number);
  await loadDate(new Date(y, m-1, d));
}

function toggleMode(){
  mode = (mode==='assign') ? 'record' : 'assign';
  const btn = document.getElementById('btn-mode');
  const banner = document.getElementById('mode-banner');
  if(mode==='record'){
    btn.classList.add('active');
    banner.classList.add('record-mode');

// ═══════════════ OT CALC ═══════════════
// Regular day rule: each work period; if >= 9 hours elapsed, deduct 60min break
// (assumes 8h work + 1h lunch break embedded in long session).
// Otherwise, no break deduction (worker rested between split periods).
// Total worked beyond 8 hours = OT.
// OFF day rule: ALL minutes count as OT (no break deduction, no 8h baseline).
function computeOtFromPeriods(periods, opts){
  const isOffDay = !!(opts && opts.isOffDay);
  let rawMin = 0;
  (periods||[]).forEach(p=>{
    if(!p.in || !p.out) return;
    const [h1,m1] = p.in.split(':').map(Number);
    const [h2,m2] = p.out.split(':').map(Number);
    let mins = (h2*60+m2) - (h1*60+m1);
    if(mins < 0) mins += 24*60; // overnight
    rawMin += Math.max(0, mins);
  });
  if(isOffDay){
    return {totalMin: 0, otMin: rawMin, rawMin};
  }
  // Regular day: deduct break only if a single period >= 9h (8h work + 1h break embedded)
  let totalMin = 0;
  (periods||[]).forEach(p=>{
    if(!p.in || !p.out) return;
    const [h1,m1] = p.in.split(':').map(Number);
    const [h2,m2] = p.out.split(':').map(Number);
    let mins = (h2*60+m2) - (h1*60+m1);
    if(mins < 0) mins += 24*60;
    const workMin = mins >= 540 ? mins - 60 : mins;  // threshold: 9 hours
    totalMin += Math.max(0, workMin);
  });
  const otMin = Math.max(0, totalMin - 8*60);
  return {totalMin, otMin, rawMin};
}

// Helper: is this day an OFF day in the schedule?
function isDayOff(empName, day){
  if(!monthData) return false;
  const emp = (monthData.employees||[]).find(e=>e.name===empName);
  if(!emp) return false;
  const s = (emp.schedule||{})[day]||'W';
  return s==='OFF' || s==='REQ_OFF';
}
function fmtHours(mins){
  if(!mins) return '0';
  const h = mins/60;
  return Number(h.toFixed(2)).toString();
}

// ═══════════════ TIME PICKER HELPER ═══════════════
// Minute step depends on context:
//   'assign' mode (กำหนดเวลาเข้างาน) → 00, 30 only
//   'record' mode (ลงเวลาทำงานจริง) → 00, 15, 30, 45
function timePicker(idPrefix, value, granularity){
  const gran = granularity || mode;  // 'assign' or 'record'
  const hh = (value||'').split(':')[0] || '08';
  const mm = (value||'').split(':')[1] || '00';
  let hOpts = '';
  for(let h=0; h<24; h++){
    const v = String(h).padStart(2,'0');
    hOpts += `<option value="${v}" ${v===hh?'selected':''}>${v}</option>`;
  }
  const minutes = (gran==='record') ? ['00','15','30','45'] : ['00','30'];
  // Round mm to nearest option
  const mmNum = parseInt(mm)||0;
  let mmRound = minutes[0];
  let minDiff = Infinity;
  minutes.forEach(opt=>{
    const diff = Math.abs(parseInt(opt) - mmNum);
    if(diff < minDiff){ minDiff = diff; mmRound = opt; }
  });
  const mOpts = minutes.map(opt=>`<option value="${opt}" ${opt===mmRound?'selected':''}>${opt}</option>`).join('');
  return `<div class="time-picker">
    <select id="${idPrefix}-h">${hOpts}</select>
    <span class="colon">:</span>
    <select id="${idPrefix}-m">${mOpts}</select>
  </div>`;
}
function readTimePicker(idPrefix){
  const h = document.getElementById(idPrefix+'-h').value;
  const m = document.getElementById(idPrefix+'-m').value;
  return `${h}:${m}`;
}

// Add N hours to a HH:MM string, wrapping at 24h
function addHoursToTime(timeStr, hours){
  if(!timeStr) return '';
  const [h, m] = timeStr.split(':').map(Number);
  const totalMin = h*60 + m + hours*60;
  const wrapped = ((totalMin % (24*60)) + 24*60) % (24*60);
  const nh = Math.floor(wrapped / 60);
  const nm = wrapped % 60;
  return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
}

// Convert "HH:MM" to Thai dot format "HH.MM"
function dotTime(t){ return t ? t.replace(':','.') : ''; }

// Set time-picker selects to a HH:MM value, snapping minutes to available options
function setTimePickerValue(idPrefix, timeStr){
  const [hh, mm] = timeStr.split(':');
  const hSel = document.getElementById(`${idPrefix}-h`);
  const mSel = document.getElementById(`${idPrefix}-m`);
  if(!hSel || !mSel) return;
  hSel.value = hh;
  const opts = Array.from(mSel.options).map(o=>parseInt(o.value));
  const mNum = parseInt(mm);
  let best = opts[0], minDiff = Infinity;
  opts.forEach(o=>{
    const d = Math.abs(o - mNum);
    if(d < minDiff){ minDiff = d; best = o; }
  });
  mSel.value = String(best).padStart(2,'0');
}

// ═══════════════ RECORD MODAL (ลงเวลาทำงานจริง — for OT) ═══════════════
let _periodsDraft = [];
function openRecordModal(empName, day){
  const cur = timeEntriesForMonth[`${empName}|${day}`] || {};
  const offDay = isDayOff(empName, day);
  if(cur.periods && cur.periods.length){
    _periodsDraft = JSON.parse(JSON.stringify(cur.periods));
  } else {
    const defaultIn = cur.work_start || (offDay ? '18:00' : '08:00');
    const defaultOut = addHoursToTime(defaultIn, 9);
    _periodsDraft = [{in: defaultIn, out: defaultOut}];
  }
  const title = offDay ? `OT พิเศษ (วันหยุด) — ${empName}` : `ลงเวลาทำงาน — ${empName}`;
  document.getElementById('modal-title').textContent = title;
  renderRecordModal(empName, day);
  document.getElementById('modal-ov').classList.add('show');
}
function renderRecordModal(empName, day){
  const cur = timeEntriesForMonth[`${empName}|${day}`] || {};

  if(offDay){
    html += `<div style="background:#faf5ff;border:1px solid #a855f7;padding:8px 10px;border-radius:6px;margin-bottom:12px;font-size:11px;color:#5d3a8c;">

      ไม่หักพักเที่ยง ไม่ลบ 8 ชม.ฐาน
    </div>`;

  _periodsDraft.forEach((p,idx)=>{
    html += `<div class="period-row">
      <span class="label">ช่วงที่ ${idx+1}</span>

        <div style="display:flex;gap:6px;align-items:center;font-size:11px;color:#8b4513;margin-bottom:4px;">
          <span style="flex:1;">เข้า</span><span style="width:14px;"></span><span style="flex:1;">ออก</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <div style="flex:1;">${timePicker('p'+idx+'-in', p.in||'08:00')}</div>

  });

  html += `<div id="period-stats-box"></div>`;
  html += `<div class="fg" style="margin-top:10px;">

  </div>`;
  html += `<p style="font-size:10px;color:#888;margin-top:4px;">${offDay?'OT พิเศษ: ค่า OT 40 บาท/ชม. คิดทุกนาที (ไม่หักพักเที่ยง)':'ค่า OT คงที่ 40 บาท/ชม. · ช่วงเวลา ≥ 9 ชม. หักพักเที่ยง 1 ชม. อัตโนมัติ (ถ้าหลายช่วงไม่หัก)'}</p>`;
  document.getElementById('modal-bd').innerHTML = html;
  document.getElementById('modal-ft').innerHTML = `
    ${(cur.periods&&cur.periods.length)?`<button class="btn-sec" style="background:#ffebee;color:#c62828;" onclick="deleteRecord('${esc(empName).replace(/'/g,"\\'")}',${day})">ลบ</button>`:''}

function readPeriodsDraft(){
  _periodsDraft.forEach((p,idx)=>{
    p.in = readTimePicker(`p${idx}-in`);

  });

function updatePeriodStats(){
  readPeriodsDraft();
  // Determine if off-day from modal title
  const title = document.getElementById('modal-title').textContent;
  const offDay = title.startsWith('OT พิเศษ');

  if(!box) return;
  if(offDay){
    box.innerHTML = `<div class="period-stats" style="background:#faf5ff;color:#5d3a8c;">

    </div>`;
  } else {
    box.innerHTML = `<div class="period-stats">
      <span>ทำงานรวม: <strong>${fmtHours(stats.totalMin)} ชม.</strong></span>
      <span class="ot">OT: <strong>${fmtHours(stats.otMin)} ชม.</strong></span>
    </div>`;
  }
}
function addPeriod(){
  readPeriodsDraft();
  // Default new period's in = previous out (or 18:00). Out = in + 9h.
  const last = _periodsDraft[_periodsDraft.length-1];
  const newIn = (last && last.out) ? last.out : '18:00';
  const newOut = addHoursToTime(newIn, 9);
  _periodsDraft.push({in:newIn, out:newOut});
  // Re-render the modal body
  const title = document.getElementById('modal-title').textContent.replace('ลงเวลาทำงาน — ','').replace('OT พิเศษ (วันหยุด) — ','');
  renderRecordModal(title, curDate.getDate());
}
function removePeriod(idx){
  readPeriodsDraft();
  _periodsDraft.splice(idx,1);
  const title = document.getElementById('modal-title').textContent.replace('ลงเวลาทำงาน — ','');
  renderRecordModal(title, curDate.getDate());
}

  const note = document.getElementById('te-note').value.trim();
  const offDay = isDayOff(empName, day);
  const stats = computeOtFromPeriods(valid, {isOffDay: offDay});
  const monthKey = dateKey(curDate);
  const cur = timeEntriesForMonth[`${empName}|${day}`] || {};
  try{
    const body = {
      month_key: monthKey, emp_name: empName, day,
      // For OFF days don't set work_start (keeps it as pure OT, not assigned-day)
      work_start: offDay ? (cur.work_start || '') : (cur.work_start || valid[0].in),
      ot_min: stats.otMin,
      break_min: 0,
      periods: valid,
      note, recorder_name: recorderName
    };
    await sbFetch('POST','time_entries?on_conflict=month_key,emp_name,day',[body],{'Prefer':'resolution=merge-duplicates,return=minimal'});
    timeEntriesForMonth[`${empName}|${day}`] = body;
    closeModal(); renderEmpList();
    const tag = offDay ? `OT พิเศษ ${fmtHours(stats.otMin)} ชม.` : `OT ${fmtHours(stats.otMin)} ชม.`;
    showToast(`บันทึกแล้ว ✓ (${tag})`);
  }catch(e){ console.error('saveRecord error:',e); showToast('⚠ '+(e.message||'บันทึกไม่สำเร็จ').slice(0,80)); }
}
async function deleteRecord(empName, day){
  if(!confirm(`ลบเวลาทำงานจริงของ ${empName} วันนี้?`)) return;
  const cur = timeEntriesForMonth[`${empName}|${day}`] || {};
  // Clear periods but keep work_start
  const monthKey = dateKey(curDate);
  try{
    const body = {
      month_key: monthKey, emp_name: empName, day,
      work_start: cur.work_start||'',
      ot_min: 0, break_min: 0, periods: [],
      note: cur.note||'', recorder_name: recorderName
    };
    if(!cur.work_start){
      await sbFetch('DELETE',`time_entries?month_key=eq.${encodeURIComponent(monthKey)}&emp_name=eq.${encodeURIComponent(empName)}&day=eq.${day}`);
      delete timeEntriesForMonth[`${empName}|${day}`];
    } else {
      await sbFetch('POST','time_entries?on_conflict=month_key,emp_name,day',[body],{'Prefer':'resolution=merge-duplicates,return=minimal'});
      timeEntriesForMonth[`${empName}|${day}`] = body;
    }
    closeModal(); renderEmpList(); showToast('ลบแล้ว');
  }catch(e){ console.error('deleteRecord error:',e); showToast('⚠ '+(e.message||'ลบไม่สำเร็จ').slice(0,80)); }
}

async function deleteEntry(empName, day){

// ═══════════════ LINE MESSAGE ═══════════════
let _lineOriginal = null;
function buildLineMessage(){
  if(!monthData) return '';
  const d = curDate.getDate();
  const employees = (monthData.employees||[]).filter(e=>e.name);
  const byTime = {}; const offNames = []; const noTimeNames = [];
  employees.forEach(e=>{
    const s = (e.schedule&&e.schedule[d])||'W';
    if(s==='OFF' || s==='REQ_OFF'){ offNames.push(e.name); return; }
    const ent = timeEntriesForMonth[`${e.name}|${d}`];
    if(ent && ent.work_start){
      const k = ent.work_start;
      if(!byTime[k]) byTime[k]=[];
      byTime[k].push(e.name);
    } else {
      noTimeNames.push(e.name);
    }
  });
  const dateSub = fmtDateSub(curDate);
  let msg = `📝 เวลาเข้างานพนักงานวันที่\n${dateSub}\n\n`;
  const times = Object.keys(byTime).sort();
  if(times.length){
    msg += `⏰ เวลา\n`;
    times.forEach(t=>{
      const hh = t.split(':')[0].padStart(2,'0');
      const mm = t.split(':')[1].padStart(2,'0');
      const tStr = mm==='00' ? `${hh}.00` : `${hh}.${mm}`;
      msg += `${tStr} น. ${byTime[t].join(', ')}\n`;
    });
  }
  if(noTimeNames.length){
    msg += `\n⚠️ ยังไม่กำหนดเวลา: ${noTimeNames.join(', ')}\n`;
  }
  if(offNames.length){
    msg += `\n❌ ${offNames.join(', ')}`;
  }
  return msg;
}

function showLineMessage(){
  if(!monthData){ alert('ยังไม่มีข้อมูล'); return; }
  _lineOriginal = buildLineMessage();
  document.getElementById('modal-title').textContent = '💬 ข้อความสำหรับ Line';
  document.getElementById('modal-bd').innerHTML = `
    <textarea id="line-textarea">${esc(_lineOriginal)}</textarea>
    <p style="font-size:11px;color:#888;text-align:center;margin-top:8px;">แก้ไขข้อความได้ก่อนส่ง · ปิดแล้วกลับเปิดใหม่จะคืนค่าเดิม</p>`;
  document.getElementById('modal-ft').innerHTML = `
    <button class="btn-sec" onclick="resetLineMsg()">↻ คืนค่าเดิม</button>
    <button class="btn-sec" onclick="closeModal()">ปิด</button>
    <button class="btn-pri" onclick="copyLineMsg()">📋 คัดลอก</button>
    <button class="btn-pri" style="background:#06c755;" onclick="shareToLine()">📲 Line</button>`;
  document.getElementById('modal-ov').classList.add('show');
}

function resetLineMsg(){
  document.getElementById('line-textarea').value = _lineOriginal || '';
  showToast('↻ คืนค่าเดิมแล้ว');
}
function copyLineMsg(){
  const msg = document.getElementById('line-textarea').value;

// ═══════════════ REPORT ═══════════════
let _reportState = {empName:'', from:null, to:null, monthsCache:{}};

function isoDateLocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

async function openReportModal(){
  if(!monthData){ alert('โหลดข้อมูลเดือนก่อน'); return; }
  // Default: current month first → last
  const y = curDate.getFullYear(), mo = curDate.getMonth();
  const first = new Date(y, mo, 1);
  const last = new Date(y, mo+1, 0);
  _reportState.from = isoDateLocal(first);
  _reportState.to = isoDateLocal(last);
  // Default emp = first working employee
  const emps = (monthData.employees||[]).filter(e=>e.name);
  if(!emps.length){ alert('ยังไม่มีพนักงาน'); return; }
  _reportState.empName = emps[0].name;
  _reportState.monthsCache = {[dateKey(curDate)]: {data:monthData, entries:timeEntriesForMonth}};
  document.getElementById('report-modal').classList.add('show');
  await renderReport();
}

function closeReportModal(){
  document.getElementById('report-modal').classList.remove('show');
}

async function ensureMonth(monthKey){
  if(_reportState.monthsCache[monthKey]) return _reportState.monthsCache[monthKey];
  try{
    const rows = await sbFetch('GET',`schedule_months?key=eq.${encodeURIComponent(monthKey)}&select=key,data`);
    const entries = await sbFetch('GET',`time_entries?month_key=eq.${encodeURIComponent(monthKey)}&select=*`);
    const eMap = {};
    entries.forEach(e=>{ eMap[`${e.emp_name}|${e.day}`] = e; });
    _reportState.monthsCache[monthKey] = {data: rows[0]?.data||null, entries: eMap};
    return _reportState.monthsCache[monthKey];
  }catch(e){ console.error(e); return {data:null, entries:{}}; }
}

function addHours(timeStr, hours){
  if(!timeStr) return '';
  const [h,m] = timeStr.split(':').map(Number);
  const total = h*60 + m + hours*60;
  const nh = Math.floor(((total%(24*60))+24*60)%(24*60) / 60);
  const nm = total % 60;
  return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
}

async function renderReport(){
  const emps = (monthData.employees||[]).filter(e=>e.name);
  const fromD = new Date(_reportState.from);
  const toD = new Date(_reportState.to);
  const empSel = emps.map(e=>`<option value="${esc(e.name)}" ${e.name===_reportState.empName?'selected':''}>${esc(e.name)} ${e.position?`(${esc(e.position)})`:''}</option>`).join('');

  let html = `<div class="rep-filter">
      <label>พนักงาน:</label>
      <select onchange="onReportFilterChange('emp', this.value)" style="flex:1;min-width:140px;">${empSel}</select>
      <label>จาก:</label>
      <input type="date" value="${_reportState.from}" onchange="onReportFilterChange('from', this.value)">
      <label>ถึง:</label>
      <input type="date" value="${_reportState.to}" onchange="onReportFilterChange('to', this.value)">
    </div>`;

  const emp = emps.find(e=>e.name===_reportState.empName) || emps[0];
  if(!emp){ document.getElementById('report-bd').innerHTML = html + '<p>ไม่มีพนักงาน</p>'; return; }

  // Collect months in range
  const monthsNeeded = new Set();
  for(let d=new Date(fromD); d<=toD; d.setDate(d.getDate()+1)){
    monthsNeeded.add(dateKey(d));
  }
  // Pre-fetch
  for(const mk of monthsNeeded){ await ensureMonth(mk); }

  // Build rows
  const rows = [];
  let sumWorkMin = 0, sumOtMin = 0, daysCame = 0, daysOff = 0, daysOtSpecial = 0, sumAdvances = 0, advCount = 0;
  for(let d=new Date(fromD); d<=toD; d.setDate(d.getDate()+1)){
    const mk = dateKey(d);
    const day = d.getDate();
    const monthInfo = _reportState.monthsCache[mk];
    if(!monthInfo || !monthInfo.data){
      rows.push({date:new Date(d), day, missing:true});
      continue;
    }
    const empInMonth = (monthInfo.data.employees||[]).find(e=>e.name===emp.name);
    const sched = empInMonth ? ((empInMonth.schedule||{})[day]||'W') : null;
    const isOffDay = sched==='OFF' || sched==='REQ_OFF';
    const entry = monthInfo.entries[`${emp.name}|${day}`] || {};
    const periods = entry.periods || [];
    let firstIn = '', lastOut = '', workMin = 0;
    if(periods.length){
      firstIn = periods[0].in || '';
      lastOut = periods[periods.length-1].out || '';
      const stats = computeOtFromPeriods(periods, {isOffDay});
      workMin = stats.totalMin;  // 0 for OFF days (all is OT)
    } else if(entry.work_start){
      firstIn = entry.work_start;
    }
    const otMin = +entry.ot_min || 0;
    const startEnd = isOffDay
      ? ''
      : (entry.work_start ? `เข้า ${dotTime(entry.work_start)}<br>เลิก ${dotTime(addHours(entry.work_start, 9))}` : '');
    let statusNote = '';
    if(sched==='OFF') statusNote='OFF';
    else if(sched==='REQ_OFF') statusNote='ลา';
    else if(sched==='HALF') statusNote='½';
    const hasEntry = !!(entry.work_start || periods.length>0);
    // Advances on this day for this employee
    const isoDay = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dayAdvances = (empInMonth?.advances||[]).filter(a=>a.date===isoDay);
    const dayAdvAmount = dayAdvances.reduce((s,a)=>s+(parseFloat(a.amount)||0),0);
    rows.push({date:new Date(d), day, mk, monthInfo, sched, isOffDay, entry, startEnd, firstIn, lastOut, workMin, otMin, statusNote, periods, note: entry.note||'', hasEntry, dayAdvances, dayAdvAmount});
    const isHalfDay = sched==='HALF';
    // HALF = 0.5/0.5 split between worked and off
    if(isOffDay){
      daysOff++;
      if(hasEntry) daysOtSpecial++;
    } else if(isHalfDay){
      daysOff += 0.5;
      if(hasEntry){ daysCame += 0.5; sumWorkMin += workMin; }
    } else {
      if(hasEntry){ daysCame++; sumWorkMin += workMin; }
    }
    if(hasEntry) sumOtMin += otMin;
    if(dayAdvAmount > 0){ sumAdvances += dayAdvAmount; advCount += dayAdvances.length; }
  }
  function fmtMoney(n){ return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2}); }

  const fromLabel = fromD.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'});
  const toLabel = toD.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'});

  // Card with table — wrapped for export
  let card = `<div class="rep-card" id="rep-card-export">
    <div class="rep-header">
      <div>
        <div class="rep-title">รายงานสรุปเวลาเข้าออกประจำวัน</div>
        <div class="rep-meta">
          รหัสพนักงาน: <strong>${esc(emp.no||'—')}</strong>　·　แผนก: <strong>${esc(emp.position||'—')}</strong><br>
          ชื่อ: <strong>${esc(emp.name)}</strong>　·　ประเภท: <strong>${({regular:'ประจำ',parttime:'พาสไทม์',intern:'ฝึกงาน'})[emp.type]||emp.type}</strong>
        </div>
      </div>
      <div style="text-align:right;font-size:12px;color:#666;">
        จากวันที่ <strong>${fromLabel}</strong><br>ถึง <strong>${toLabel}</strong>
      </div>
    </div>
    <table class="rep-tbl">
      <thead>
        <tr>
          <th style="width:100px;white-space:nowrap;">วันที่</th>
          <th style="width:90px;">ตารางเวลา</th>
          <th style="width:60px;">เข้า</th>
          <th style="width:120px;">ออก</th>
          <th style="width:70px;">เวลารวม</th>
          <th style="width:60px;">OT</th>
          <th>หมายเหตุ</th>
        </tr>
      </thead>
      <tbody>`;
  rows.forEach((r, idx)=>{
    if(r.missing){
      card += `<tr class="off-row"><td colspan="7" style="color:#aaa;">— ไม่มีตารางเดือนนี้ —</td></tr>`;
      return;
    }
    const dowTH = ['อา','จ','อ','พ','พฤ','ศ','ส'][r.date.getDay()];
    const dateLabel = `${String(r.day).padStart(2,'0')}/${String(r.date.getMonth()+1).padStart(2,'0')}/${beYearShort(r.date.getFullYear())} (${dowTH})`;
    // Row color
    let rowCls = '';
    let rowStyle = '';
    if(r.isOffDay && r.hasEntry){ rowStyle = 'background:#faf5ff;'; }
    else if(r.isOffDay){ rowCls = 'off-row'; }
    else if(r.hasEntry){ rowCls = 'has-entry'; }

    // (3) Schedule time column: always show OFF/ลา for off days (no "OT พิเศษ" here)
    //     For working days: 2-line "เข้า/เลิก" with Thai dot format, end = start + 9h
    const startEndCell = r.isOffDay
      ? (r.statusNote==='OFF'?'<span style="color:#c0392b;font-weight:700;">OFF</span>':'<span style="color:#7c2d12;font-weight:700;">ลา</span>')
      : (r.startEnd || '—');

    // (4) Out column: if multiple periods, show "out1, in2-out2, in3-out3, ..."
    let outCell = '—';
    if(r.periods && r.periods.length){
      if(r.periods.length === 1){
        outCell = esc(r.periods[0].out || '');
      } else {
        const parts = [esc(r.periods[0].out || '')];
        for(let i=1; i<r.periods.length; i++){
          parts.push(`${esc(r.periods[i].in||'')}-${esc(r.periods[i].out||'')}`);
        }
        outCell = parts.join(', ');
      }
    } else if(r.lastOut){
      outCell = esc(r.lastOut);
    }

    // (1)(3) Note column: OT พิเศษ moved here; "วันหยุด" for OFF without OT
    let noteCell = '';
    if(r.isOffDay && r.hasEntry){
      noteCell = '<span style="color:#a855f7;font-weight:700;">OT พิเศษ</span>' + (r.note?' · '+esc(r.note):'');
    } else if(r.isOffDay){
      noteCell = r.statusNote==='ลา' ? 'ลา' : 'วันหยุด';
      if(r.note) noteCell += ' · '+esc(r.note);
    } else {
      noteCell = esc(r.note) || '';
    }
    // Append advance notice if any on this day
    if(r.dayAdvAmount > 0){
      const reasons = r.dayAdvances.filter(a=>a.note).map(a=>esc(a.note)).join(', ');
      const advTag = `<span style="color:#c62828;font-weight:700;">💸 เบิก ${fmtMoney(r.dayAdvAmount)} บาท${r.dayAdvances.length>1?` (${r.dayAdvances.length}×)`:''}${reasons?` · ${reasons}`:''}</span>`;
      noteCell = noteCell ? noteCell + ' · ' + advTag : advTag;
    }

    card += `<tr class="${rowCls}" style="${rowStyle}" onclick="editReportRow('${esc(emp.name).replace(/'/g,"\\'")}','${r.mk}',${r.day})">
      <td class="date-cell">${dateLabel}</td>
      <td>${startEndCell}</td>
      <td>${esc(r.firstIn)||'—'}</td>
      <td style="white-space:nowrap;font-size:10px;">${outCell}</td>
      <td>${r.workMin?fmtHours(r.workMin)+' ชม.':'—'}</td>
      <td>${r.otMin?fmtHours(r.otMin)+' ชม.':'—'}</td>
      <td class="note-cell">${noteCell}</td>
    </tr>`;
  });
  card += `</tbody>
      <tfoot>
        <tr>
          <td colspan="4" style="text-align:right;">รวม</td>
          <td>${fmtHours(sumWorkMin)} ชม.</td>
          <td>${fmtHours(sumOtMin)} ชม.</td>
          <td style="text-align:left;">มา ${daysCame} วัน · หยุด ${daysOff} วัน</td>
        </tr>
      </tfoot>
    </table>
    <div class="rep-summary">
      <div><span>วันทำงาน</span><strong>${daysCame}</strong></div>
      <div><span>วันหยุด</span><strong>${daysOff}</strong></div>
      <div><span>OT รวม</span><strong>${fmtHours(sumOtMin)} ชม.</strong></div>
      ${sumAdvances>0?`<div style="background:#ffebee;border-radius:6px;padding:6px 8px;"><span style="color:#c62828;">💸 เบิกล่วงหน้า</span><strong style="color:#c62828;">${fmtMoney(sumAdvances)} บาท</strong><div style="font-size:9px;color:#c62828;">(${advCount} ครั้ง)</div></div>`:''}
      <div style="text-align:center;">
        <span style="color:#666;">ลายเซ็น</span>
        <div style="margin-top:18px;border-bottom:1.5px solid #333;height:1px;width:80%;margin-left:auto;margin-right:auto;"></div>
        <div style="font-size:10px;color:#666;margin-top:4px;">(................................)</div>
      </div>
    </div>
    <p style="font-size:10px;color:#888;margin-top:8px;text-align:center;">แตะแถวเพื่อแก้ไขเวลาทำงานของวันนั้น</p>
  </div>`;
  document.getElementById('report-bd').innerHTML = html + card;
}

async function onReportFilterChange(field, value){
  if(field==='emp') _reportState.empName = value;
  else if(field==='from') _reportState.from = value;
  else if(field==='to') _reportState.to = value;
  await renderReport();
}

async function editReportRow(empName, monthKey, day){
  // Switch curDate to that month and open record modal
  const [y, m] = monthKey.split('-').map(Number);
  // Set curDate to that day temporarily
  const savedDate = new Date(curDate);
  curDate = new Date(y, m-1, day);
  // Ensure timeEntriesForMonth reflects that month
  const monthInfo = _reportState.monthsCache[monthKey] || await ensureMonth(monthKey);
  timeEntriesForMonth = monthInfo.entries;
  monthData = monthInfo.data;
  // Temporarily set mode=record for proper time picker granularity
  const savedMode = mode;
  mode = 'record';
  openRecordModal(empName, day);
  // Patch save callback to refresh report after save
  const origSave = saveRecord;
  window.saveRecord = async function(en, dy){
    await origSave(en, dy);
    // Update cache and re-render report
    if(_reportState.monthsCache[monthKey]){
      _reportState.monthsCache[monthKey].entries = timeEntriesForMonth;
    }
    window.saveRecord = origSave;
    mode = savedMode;
    curDate = savedDate;
    // Restore main view state
    await loadDate(curDate);
    await renderReport();
  };
  // Also restore on cancel
  const origCloseModal = closeModal;
  window.closeModal = function(){
    origCloseModal();
    window.saveRecord = origSave;
    window.closeModal = origCloseModal;
    mode = savedMode;
    curDate = savedDate;
    loadDate(curDate);
  };
}

async function exportReportPNG(){
  const node = document.getElementById('rep-card-export'); if(!node) return;
  showToast('⏳ กำลังสร้างรูป...');
  try{
    const canvas = await html2canvas(node, {backgroundColor:'#fff', scale:2, useCORS:true, allowTaint:true, logging:false});
    const fname = `รายงาน-${_reportState.empName}-${_reportState.from}_${_reportState.to}.png`;
    canvas.toBlob(async (blob)=>{
      if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.share && navigator.canShare){
        const file = new File([blob], fname, {type:'image/png'});
        if(navigator.canShare({files:[file]})){
          try{ await navigator.share({files:[file], title:fname}); showToast('📷 พร้อมแชร์'); return; }catch(e){ if(e.name==='AbortError') return; }
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      showToast('📷 บันทึกรูปแล้ว');
    },'image/png',0.95);
  }catch(e){ console.error(e); showToast('⚠ '+(e.message||'').slice(0,80)); }
}

async function exportReportPDF(){
  const node = document.getElementById('rep-card-export'); if(!node) return;
  if(!window.jspdf){ showToast('⚠ jspdf ไม่พร้อม'); return; }
  showToast('⏳ กำลังสร้าง PDF...');
  try{
    const canvas = await html2canvas(node, {backgroundColor:'#fff', scale:2, useCORS:true, allowTaint:true, logging:false});
    const {jsPDF} = window.jspdf;
    const w = canvas.width, h = canvas.height;
    const orient = w>h ? 'landscape' : 'portrait';
    const pdf = new jsPDF({orientation:orient, unit:'pt', format:'a4'});
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 24;
    const scale = Math.min((pageW-margin*2)/w, (pageH-margin*2)/h);
    pdf.addImage(canvas.toDataURL('image/png'),'PNG', (pageW-w*scale)/2, (pageH-h*scale)/2, w*scale, h*scale);
    pdf.save(`รายงาน-${_reportState.empName}-${_reportState.from}_${_reportState.to}.pdf`);
    showToast('📄 บันทึก PDF แล้ว');
  }catch(e){ console.error(e); showToast('⚠ '+(e.message||'').slice(0,80)); }
}

// ═══════════════ TOAST ═══════════════
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'), 2400);
}

// ═══════════════ INIT ═══════════════
init();
</script>
