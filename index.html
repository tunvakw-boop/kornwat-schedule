<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ตารางพนักงาน - Kornwat Garden Resort</title>
<meta name="theme-color" content="#e07b54">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'Sarabun',sans-serif;}
body{background:#fef9e7;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:#3d2914;}

/* ── HEADER (two rows) ── */
#app-header{background:#e07b54;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25);display:flex;flex-direction:column;}
.hd-row{display:flex;align-items:center;gap:6px;padding:0 8px;}
.hd-row-1{height:34px;}
.hd-row-2{height:40px;border-top:1px solid rgba(0,0,0,.12);background:rgba(0,0,0,.07);gap:5px;padding:5px 6px;}
#resort-short{font-size:13px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#sync-dot{width:9px;height:9px;border-radius:50%;background:#4caf50;flex-shrink:0;box-shadow:0 0 4px rgba(76,175,80,.6);}
#sync-dot.syncing{background:#ff9800;box-shadow:0 0 4px rgba(255,152,0,.6);animation:sync-pulse 1s infinite;}
#sync-dot.error{background:#f44336;box-shadow:0 0 4px rgba(244,67,54,.6);}
@keyframes sync-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hd-btn{background:rgba(255,255,255,.22);border:none;color:#fff;width:34px;height:30px;border-radius:6px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;font-family:'Sarabun',sans-serif;}
.hd-btn:active{background:rgba(255,255,255,.45);transform:scale(.92);}
.hd-btn.locked{background:rgba(0,0,0,.32);}
.hd-btn.unlocked{background:#fff3c4;color:#5d4037;}
#btn-save{flex:1;height:30px;background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;font-weight:700;font-family:'Sarabun',sans-serif;line-height:1;min-width:0;}
#btn-save:active{transform:scale(.97);}
#btn-save.dirty{background:#ffc107;color:#3d2914;animation:dirty-pulse 1.6s infinite;}
#btn-save.dirty #save-info{color:#5d4037;}
#save-info{font-size:10px;opacity:.85;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@keyframes dirty-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,193,7,.55)}50%{box-shadow:0 0 0 5px rgba(255,193,7,0)}}

/* ── VIEWS ── */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.view{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.view.hidden{display:none!important;}

/* ── SCHEDULE VIEW ── */
.sched-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px;}
.tbl-frame{display:inline-block;border:2px solid #d99672;border-radius:8px;overflow:hidden;background:#fffdf5;}

#sched-tbl{border-collapse:collapse;font-size:11px;white-space:nowrap;background:#fffdf5;}
#sched-tbl th,#sched-tbl td{border:1px solid #e8c4a8;padding:0;text-align:center;vertical-align:middle;font-family:'Sarabun',sans-serif;}

/* Title row — bigger, prominent */
.title-row td{background:#fef0e0;padding:14px 12px 10px;border-bottom:2px solid #d99672!important;}
.title-row span{color:#c44a1f;font-size:19px;font-weight:800;letter-spacing:.3px;font-family:'Sarabun',sans-serif;}
.title-row .sub{color:#8b4513;font-size:13px;font-weight:600;margin-top:2px;display:block;}

/* Sticky name col */
.nc{position:sticky;left:0;z-index:3;background:#fde8d8;min-width:110px;max-width:110px;text-align:left!important;padding:4px 6px!important;border-right:2px solid #d99672!important;font-size:11px;font-weight:700;color:#8b4513;}
.nc-body{position:sticky;left:0;z-index:2;background:#fffdf5;min-width:110px;max-width:110px;text-align:left!important;padding:4px 6px!important;border-right:2px solid #d99672!important;}

/* Header rows */
.hdr1 th,.hdr2 th{background:#fde8d8;color:#8b4513;font-size:11px;font-weight:700;height:26px;font-family:'Sarabun',sans-serif;}
.hdr2 th{font-size:10px;height:22px;font-weight:600;}
/* Weekend highlight — applies to header AND day cells */
.hdr1 th.wknd,.hdr2 th.wknd{background:#fce4ec;color:#c2185b;}
.sub-hd{background:#fde8d8;color:#8b4513;font-size:11px;font-weight:700;padding:2px 4px!important;line-height:1.15;}
.sub-hd-sm{font-size:10px;font-weight:600;}

/* Day cells — balanced, same font/size */
.dc{width:26px;min-width:26px;height:30px;cursor:pointer;user-select:none;font-size:10px;font-weight:700;color:transparent;font-family:'Sarabun',sans-serif;}
.dc:active{opacity:.65;}
.dc.W{background:#d5edd8;}
.dc.OFF{background:#e74c3c;color:#fff;font-weight:800;}
.dc.HALF{background:#fef3c0;color:#d97706;font-weight:700;}
.dc.REQ_OFF{background:#fcd34d;color:#7c2d12;font-weight:800;}
/* Weekend: only the W (background) cells get pink tint matching header.
   OFF / HALF / REQ_OFF keep their normal colors regardless of weekday. */
.dc.wknd.W{background:#fce4ec;}
.dc.pub-h{position:relative;}
.dc.pub-h::after{content:'★';position:absolute;top:0;right:1px;font-size:7px;color:#ff6f00;line-height:1.2;}

/* Employee name cell */
.emp-name{color:#c44a1f;font-weight:700;font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;line-height:1.2;cursor:pointer;}
.emp-pos{font-size:9px;display:block;color:#666;line-height:1.15;margin-top:1px;}
.emp-no-cell{text-align:center!important;font-size:11px;font-weight:700;color:#8b4513;}

/* Summary cols */
.sc{min-width:30px;width:30px;height:30px;font-size:11px;font-weight:700;background:#fffdf5;font-family:'Sarabun',sans-serif;}
.sc.wk{color:#2e7d32;}.sc.of{color:#c0392b;}.sc.vc{color:#1565c0;}.sc.ph{color:#6a1b9a;}

/* Remark col */
.rc{min-width:90px;font-size:10px;color:#555;text-align:left!important;padding:3px 5px!important;background:#fffdf5;cursor:pointer;}

/* Group row */
.grp-row td{background:#fef3e2;height:72px;}
.grp-row .nc-body{background:#fde8d8;color:#8b4513;font-weight:700;font-size:11px;}
.grp-cell{cursor:pointer;padding:0!important;vertical-align:middle;text-align:center!important;position:relative;overflow:visible;width:26px;min-width:26px;max-width:26px;}
.grp-cell:active{background:#fce4ec!important;}
.grp-cell.has-grp{background:#fff3e0;}
/* Use absolute positioning + transform so text always centers in cell,
   regardless of natural text width. Reads bottom-to-top (tilt head left). */
.grp-cell .grp-txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center center;white-space:nowrap;font-size:10px;color:#5d4037;font-weight:600;font-family:'Sarabun',sans-serif;line-height:1;letter-spacing:.2px;pointer-events:none;}

/* Excel-style month tabs */
#month-tabs{display:flex;background:#f0e0d0;border-top:2px solid #d99672;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;height:36px;align-items:flex-end;padding:0 2px;}
#month-tabs::-webkit-scrollbar{height:0;}
.mtab{flex-shrink:0;padding:7px 14px 6px;background:#e8d8c4;color:#5d4037;border:1px solid #c4a484;border-bottom:none;border-radius:0;font-size:11px;font-weight:600;cursor:pointer;margin-right:1px;font-family:'Sarabun',sans-serif;white-space:nowrap;line-height:1.2;border-top-left-radius:4px;border-top-right-radius:4px;height:30px;display:flex;align-items:center;gap:4px;}
.mtab.active{background:#fffdf5;color:#c44a1f;font-weight:800;border-color:#d99672;border-bottom:2px solid #fffdf5;margin-bottom:-2px;height:32px;z-index:2;}
.mtab:active{opacity:.7;}
.mtab-add{flex-shrink:0;width:32px;height:30px;background:#fff;color:#e07b54;border:1px solid #c4a484;border-bottom:none;border-top-left-radius:4px;border-top-right-radius:4px;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.mtab-add:active{background:#fef0e0;}

/* Note bar */
#note-bar{background:#fff9c4;color:#5d4037;font-size:11px;padding:5px 10px;border-top:1px solid #f0e0a0;flex-shrink:0;display:none;font-family:'Sarabun',sans-serif;}

/* Legend */
.legend{display:flex;gap:10px;padding:5px 10px;background:#fef9e7;border-top:1px solid #f4b8a0;flex-shrink:0;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#8b4513;font-family:'Sarabun',sans-serif;}
.leg-dot{width:13px;height:13px;border-radius:2px;display:inline-block;border:1px solid #ddd;}

/* ── SUMMARY / REPORT / PAYROLL / MANAGE scroll fix ── */
#summary-view,#report-view,#payroll-view,#manage-view{display:block!important;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 30px;height:100%;}
#summary-view.hidden,#report-view.hidden,#payroll-view.hidden,#manage-view.hidden{display:none!important;}
.sum-card{background:#fff;border-radius:8px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.sum-card-hd{background:#e07b54;color:#fff;padding:8px 12px;font-size:13px;font-weight:700;}
.sum-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.sum-tbl th{background:#fde8d8;color:#8b4513;padding:5px 6px;font-size:10px;font-weight:700;}
.sum-tbl td{padding:6px 8px;border-bottom:1px solid #f9f0e8;}
.sum-tbl tr:last-child td{border-bottom:none;}
.sum-tbl td:first-child{text-align:left;font-weight:600;color:#e07b54;}
.badge{display:inline-block;padding:1px 5px;border-radius:8px;font-size:9px;font-weight:600;}
.b-reg{background:#e8f5e9;color:#2e7d32;}.b-pt{background:#e3f2fd;color:#1565c0;}.b-int{background:#fff3e0;color:#e65100;}

/* ── MANAGE VIEW ── */
.mg-sec{background:#fff;border-radius:8px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12);}
.mg-hd{background:#e07b54;color:#fff;padding:9px 12px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.mg-body{padding:10px;}
.mg-item{display:flex;align-items:center;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #fde8d8;gap:8px;}
.mg-item:last-child{border-bottom:none;}
.btn-sm{padding:5px 10px;border:none;border-radius:4px;font-size:11px;cursor:pointer;font-family:'Sarabun',sans-serif;font-weight:600;}
.btn-add{background:#e07b54;color:#fff;}
.btn-edit{background:#e3f2fd;color:#1565c0;}
.btn-del{background:#ffebee;color:#c62828;}
.btn-pri{background:#e07b54;color:#fff;padding:8px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:'Sarabun',sans-serif;font-weight:600;}
.btn-sec{background:#e0e0e0;color:#333;padding:8px 16px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:'Sarabun',sans-serif;font-weight:600;}
.fg{margin-bottom:11px;}.fg label{display:block;font-size:11px;color:#8b4513;margin-bottom:3px;font-weight:600;}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border:1px solid #f4b8a0;border-radius:5px;font-size:13px;font-family:'Sarabun',sans-serif;background:#fff;}
.fg textarea{height:60px;resize:vertical;}
.fr{display:flex;gap:8px;}.fr .fg{flex:1;}

/* ── MODAL ── */
#modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
#modal-ov.hidden{display:none;}
#modal-box{background:#fff;border-radius:12px;width:100%;max-width:380px;overflow:hidden;max-height:88vh;display:flex;flex-direction:column;}
#modal-hd{background:#e07b54;color:#fff;padding:13px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
#modal-cl{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;}
#modal-bd{padding:14px;overflow-y:auto;}
#modal-ft{padding:10px 14px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid #fde8d8;}

/* ── BOTTOM NAV ── */
#bottom-nav{display:flex;background:#fff;border-top:1px solid #f4b8a0;height:54px;flex-shrink:0;}
.nb{flex:1;border:none;background:none;font-family:'Sarabun',sans-serif;font-size:10px;color:#aaa;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;}
.nb .ni{font-size:18px;}
.nb.active{color:#e07b54;}

/* ── FAB ── */
#fab{position:fixed;right:14px;bottom:100px;width:46px;height:46px;border-radius:50%;background:#e07b54;color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.3);z-index:50;display:flex;align-items:center;justify-content:center;font-family:'Sarabun',sans-serif;}
#fab.hidden{display:none;}
#fab:active{transform:scale(.93);}

/* ── TOAST ── */
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:7px 14px;border-radius:18px;font-size:12px;z-index:200;transition:opacity .3s;pointer-events:none;white-space:nowrap;font-family:'Sarabun',sans-serif;}
#toast.h{opacity:0;}

/* ── LOCK overlay state ── */
.locked-cell{cursor:default!important;}
.locked-cell:active{opacity:1!important;}
#lock-banner{background:#fff3c4;color:#7a5d20;font-size:11px;padding:4px 10px;text-align:center;border-bottom:1px solid #e9d090;flex-shrink:0;font-weight:600;}
#lock-banner.hidden{display:none;}

/* ── EXPORTING state (strip sticky/overflow so html2canvas can capture full table) ── */
body.exporting{overflow:visible!important;height:auto!important;}
body.exporting #bottom-nav,
body.exporting #fab,
body.exporting #lock-banner,
body.exporting #note-bar,
body.exporting .legend,
body.exporting #month-tabs,
body.exporting #app-header{display:none!important;}
body.exporting #main{overflow:visible!important;height:auto!important;}
body.exporting .view{overflow:visible!important;height:auto!important;}
body.exporting .sched-wrap{overflow:visible!important;padding:8px!important;}
body.exporting .tbl-frame{overflow:visible!important;display:inline-block!important;}
body.exporting .nc,
body.exporting .nc-body{position:static!important;}
body.exporting #sched-tbl{width:auto!important;}
/* Hide UI-only elements when exporting payroll/report */
body.exporting .no-export{display:none!important;}
</style>
</head>
<body>

<div id="app-header">
  <div class="hd-row hd-row-1">
    <span id="resort-short">🌿 Kornwat Garden Resort</span>
    <span id="sync-dot" title="สถานะคลาวด์"></span>
  </div>
  <div class="hd-row hd-row-2">
    <button class="hd-btn locked" id="btn-lock" title="ล็อก/ปลดล็อก">🔒</button>
    <button id="btn-save" title="บันทึก"><span>💾 บันทึก</span><span id="save-info">— ยังไม่มีการบันทึก</span></button>
    <button class="hd-btn" id="btn-png" title="บันทึกรูป">📷</button>
    <button class="hd-btn" id="btn-pdf" title="บันทึก PDF">📄</button>
  </div>
</div>
<div id="lock-banner" class="hidden">🔓 โหมดแก้ไข — แตะปุ่ม 💾 บันทึก เมื่อแก้เสร็จ</div>

<div id="main">
  <div id="schedule-view" class="view">
    <div class="sched-wrap" id="sched-wrap">
      <div class="tbl-frame" id="tbl-frame">
        <table id="sched-tbl">
          <thead id="tbl-head"></thead>
          <tbody id="tbl-body"></tbody>
          <tfoot id="tbl-foot"></tfoot>
        </table>
      </div>
    </div>
    <div id="month-tabs"></div>
    <div class="legend">
      <div class="leg-item"><span class="leg-dot" style="background:#d5edd8;"></span>ทำงาน</div>
      <div class="leg-item"><span style="color:#fff;background:#e74c3c;padding:1px 5px;border-radius:2px;font-weight:700;font-size:9px;">OFF</span>หยุดประจำ</div>
      <div class="leg-item"><span class="leg-dot" style="background:#fef3c0;"></span>ครึ่งวัน (½)</div>
      <div class="leg-item"><span style="color:#7c2d12;background:#fcd34d;padding:1px 5px;border-radius:2px;font-weight:700;font-size:9px;">OFF</span>หยุด (รีเควส)</div>
      <div class="leg-item"><span style="color:#ff6f00;font-size:10px;">★</span>วันหยุดนักขัตฤกษ์</div>
      <div class="leg-item"><span class="leg-dot" style="background:#fce4ec;border-color:#fce4ec;"></span>เสาร์-อาทิตย์</div>
    </div>
    <div id="note-bar"></div>
  </div>

  <div id="summary-view" class="view hidden"></div>
  <div id="report-view" class="view hidden"></div>
  <div id="payroll-view" class="view hidden"></div>
  <div id="manage-view" class="view hidden"></div>
</div>

<nav id="bottom-nav">
  <button class="nb active" data-v="schedule"><span class="ni">📅</span>ตาราง</button>
  <button class="nb" data-v="summary"><span class="ni">📊</span>สรุป</button>
  <button class="nb" data-v="report"><span class="ni">📋</span>รายงาน</button>
  <button class="nb" data-v="payroll"><span class="ni">💰</span>เงินเดือน</button>
  <button class="nb" data-v="manage"><span class="ni">⚙️</span>จัดการ</button>
</nav>

<button id="fab">+</button>

<div id="modal-ov" class="hidden">
  <div id="modal-box">
    <div id="modal-hd"><span id="modal-title"></span><button id="modal-cl">×</button></div>
    <div id="modal-bd"></div>
    <div id="modal-ft"></div>
  </div>
</div>
<div id="toast" class="h"></div>

<script>
// ═══════════════════ CONST ═══════════════════
const MONTH_TH = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MONTH_TH_SHORT = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MONTH_EN = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
const DAY_TH = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const TYPE_LBL = {regular:'ประจำ',parttime:'พาสไทม์',intern:'ฝึกงาน'};
const BADGE_CLS = {regular:'b-reg',parttime:'b-pt',intern:'b-int'};
// 4-state cycle: W → OFF (red) → HALF (½) → REQ_OFF (yellow) → W
const CYCLE = {W:'OFF',OFF:'HALF',HALF:'REQ_OFF',REQ_OFF:'W'};
const STATE_LBL = {W:'',OFF:'OFF',HALF:'½',REQ_OFF:'OFF'};
// 4 pastel colors for group cells
const GRP_COLORS = [
  {key:'',     bg:'',         label:'ค่าเริ่มต้น', dot:'#fff3e0'},
  {key:'pink', bg:'#ffd6e0',  label:'ชมพู',       dot:'#ffd6e0'},
  {key:'blue', bg:'#c8e6f4',  label:'ฟ้า',        dot:'#c8e6f4'},
  {key:'mint', bg:'#c8e6c9',  label:'มิ้นต์',      dot:'#c8e6c9'},
  {key:'yellow',bg:'#fff4c4', label:'เหลือง',     dot:'#fff4c4'},
];
function grpColorBg(key){
  const c = GRP_COLORS.find(x=>x.key===key);
  return c ? c.bg : '';
}
// Normalize group entry — may be string (legacy) or {name,color} (new)
function normGroup(v){
  if(!v) return {name:'', color:''};
  if(typeof v === 'string') return {name:v, color:''};
  return {name:v.name||'', color:v.color||''};
}

// Thai public holidays (วันหยุดนักขัตฤกษ์) by "YYYY-MM" → [day numbers]
// Source: Thai Cabinet announcements / Bank of Thailand calendars
const TH_HOLIDAYS = {
  '2025-01':{days:[1],note:'วันขึ้นปีใหม่'},

async function sbFetch(method, path, body, extraHeaders){
  const headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer '+SB_KEY,
    'Content-Type': 'application/json',
    'Prefer': method==='POST'?'return=representation':'',
  };
  if(extraHeaders) Object.assign(headers, extraHeaders);
  const res = await fetch(SB_URL+'/rest/v1/'+path, {method, headers, body: body?JSON.stringify(body):undefined});
  if(!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

function setSync(state){ // ok | syncing | error
  const d = document.getElementById('sync-dot');
  d.className = state==='ok'?'':state;
}

async function cloudList(){
  return await sbFetch('GET','schedule_months?select=key,data&order=key.desc');
}
async function cloudUpsert(key, monthData){
  return await sbFetch('POST','schedule_months',[{key, data:monthData}],{'Prefer':'resolution=merge-duplicates,return=minimal'});
}
async function cloudDelete(key){
  return await sbFetch('DELETE','schedule_months?key=eq.'+encodeURIComponent(key));
}

async function cloudGetTimeEntriesForMonth(monthKey){
  return await sbFetch('GET',`time_entries?month_key=eq.${encodeURIComponent(monthKey)}&select=*`);
}
async function cloudUpsertTimeEntry(entry){
  return await sbFetch('POST','time_entries?on_conflict=month_key,emp_name,day',[entry],{'Prefer':'resolution=merge-duplicates,return=minimal'});
}
async function cloudDeleteTimeEntry(monthKey, empName, day){
  return await sbFetch('DELETE',`time_entries?month_key=eq.${encodeURIComponent(monthKey)}&emp_name=eq.${encodeURIComponent(empName)}&day=eq.${day}`);
}

// SHA-256 hex of string (for PIN hashing)
async function sha256Hex(str){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Cache of time entries for current month (keyed by emp_name|day)
let _timeEntriesCache = {}; // month_key → {empName|day → entry}
async function loadTimeEntries(monthKey){
  if(_timeEntriesCache[monthKey]) return _timeEntriesCache[monthKey];
  try{
    const rows = await cloudGetTimeEntriesForMonth(monthKey);
    const map = {};
    rows.forEach(r => { map[`${r.emp_name}|${r.day}`] = r; });
    _timeEntriesCache[monthKey] = map;
    return map;
  }catch(e){ console.error('loadTimeEntries',e); return {}; }
}
function invalidateTimeEntriesCache(monthKey){
  if(monthKey) delete _timeEntriesCache[monthKey];
  else _timeEntriesCache = {};
}

const pushTimers = {};

  clearTimeout(pushTimers[k]);
  pushTimers[k] = setTimeout(async ()=>{
    try{ await cloudUpsert(k, data[k]); setSync('ok'); }
    catch(e){ console.error('push',e); setSync('error'); }
  }, 700);
}

}

let data = {}, curKey = '', curView = 'schedule';
let locked = true, isDirty = false, lastSavedAt = null;
const LSK = 'kw_sched_v4';
const LSK_META = 'kw_sched_v4_meta';

const clone = o => JSON.parse(JSON.stringify(o));
const sorted = () => Object.keys(data).sort();
const saveLocal = () => localStorage.setItem(LSK, JSON.stringify(data));
const dow = (y,m,d) => new Date(y,m-1,d).getDay();
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const beYear = y => y + 543;
const beYearShort = y => String(y+543).slice(-2);

// ═══════════════════ INIT ═══════════════════
async function init(){
  const saved = localStorage.getItem(LSK);
  data = saved ? (()=>{try{return JSON.parse(saved);}catch{return clone(EXCEL);}})() : clone(EXCEL);
  ensurePositionField(data);
  ensureSalaryField(data);
  ensureExpensesField(data);
  ensureAdvancesField(data);
  migrateToHolidayModel(data);
  // Load meta (lastSavedAt + dirty flag)
  try{
    const meta = JSON.parse(localStorage.getItem(LSK_META)||'{}');
    lastSavedAt = meta.lastSavedAt || null;
    isDirty = !!meta.isDirty;
  }catch{ lastSavedAt=null; isDirty=false; }
  const ks = sorted();
  curKey = ks[ks.length-1] || '2026-05';
  setupEvents();
  applyLockUI();
  updateSaveLabel();
  render();
  await syncFromCloud();
}

// ── lock / dirty / save label ──
function applyLockUI(){
  const btn = document.getElementById('btn-lock');
  const banner = document.getElementById('lock-banner');
  if(locked){
    btn.textContent='🔒'; btn.classList.add('locked'); btn.classList.remove('unlocked');
    btn.title='ปลดล็อกเพื่อแก้ไข';
    banner.classList.add('hidden');
  }else{
    btn.textContent='🔓'; btn.classList.add('unlocked'); btn.classList.remove('locked');
    btn.title='ล็อก (อ่านอย่างเดียว)';
    banner.classList.remove('hidden');
  }
}
function toggleLock(){
  locked = !locked;
  applyLockUI();
  showToast(locked?'🔒 ล็อกแล้ว':'🔓 ปลดล็อก — แก้ไขได้');
}
function markDirty(){
  isDirty = true;
  saveMeta();
  updateSaveLabel();
}
function clearDirty(){
  isDirty = false;
  lastSavedAt = new Date().toISOString();
  saveMeta();
  updateSaveLabel();
}
function saveMeta(){
  try{ localStorage.setItem(LSK_META, JSON.stringify({lastSavedAt, isDirty})); }catch{}
}
function fmtSavedAt(){
  if(!lastSavedAt) return '— ยังไม่มีการบันทึก';
  const t = new Date(lastSavedAt);
  const now = new Date();
  const sameDay = t.toDateString()===now.toDateString();
  const hh = String(t.getHours()).padStart(2,'0');
  const mm = String(t.getMinutes()).padStart(2,'0');
  if(sameDay) return `บันทึกล่าสุด ${hh}:${mm}`;
  const dd = String(t.getDate()).padStart(2,'0');
  const mo = String(t.getMonth()+1).padStart(2,'0');
  return `บันทึกล่าสุด ${dd}/${mo} ${hh}:${mm}`;
}
function updateSaveLabel(){
  const info = document.getElementById('save-info');
  const btn = document.getElementById('btn-save');
  if(!info||!btn) return;
  if(isDirty){
    info.textContent = '• ยังไม่บันทึก';
    btn.classList.add('dirty');
  }else{
    info.textContent = fmtSavedAt();
    btn.classList.remove('dirty');
  }
}

function ensurePositionField(d){
  Object.values(d).forEach(m=>{
    (m.employees||[]).forEach(e=>{ if(e.position===undefined) e.position=''; });
  });
}

// Salary fields: salary (number) + salaryUnit ('month'|'day')
function ensureSalaryField(d){
  Object.values(d).forEach(m=>{
    (m.employees||[]).forEach(e=>{
      if(e.salary===undefined) e.salary='';
      if(e.salaryUnit===undefined){
        e.salaryUnit = (e.type==='regular') ? 'month' : 'day';
      }
    });
  });
}

// Recurring expenses per month: [{name, amount, note}, ...]
function ensureExpensesField(d){
  Object.values(d).forEach(m=>{
    if(!Array.isArray(m.expenses)) m.expenses = [];
  });
}

// Cash advances per employee per month: [{date, amount, note}, ...]
function ensureAdvancesField(d){
  Object.values(d).forEach(m=>{
    (m.employees||[]).forEach(e=>{
      if(!Array.isArray(e.advances)) e.advances = [];
    });
  });
}

// Fixed OT rate (baht/hour) — same for everyone
const OT_RATE_PER_HOUR = 40;

// Migrate to new model:
//   - m.holidaysAdded (number) = how many extra holidays added this month
//   - emp.phCarry (number) = carryover from previous month, frozen at month creation
//   - For type=regular: phTotal/phRemain/vacUsed are DERIVED (not stored)
function migrateToHolidayModel(d){
  Object.values(d).forEach(m=>{
    if(m.holidaysAdded === undefined){
      m.holidaysAdded = (m.publicHolidays||[]).length;
    }
    (m.employees||[]).forEach(e=>{
      if(e.phCarry === undefined){
        const stored = parseFloat(e.phTotal||0)||0;
        e.phCarry = Math.max(0, stored - (m.holidaysAdded||0));
      }
    });
  });
}

// Count days of a specific weekday (0=Sun..6=Sat) in a month
function countWeekdayInMonth(year, month, weekday){
  const days = new Date(year, month, 0).getDate();
  let count=0;
  for(let d=1; d<=days; d++){
    if(new Date(year, month-1, d).getDay()===weekday) count++;
  }
  return count;
}

// Derive employee stats. Regulars: auto-calc. Others: use stored values.
function deriveEmpStats(emp, m){
  let off=0, half=0, reqOff=0, wk=0;
  for(let d=1; d<=m.days; d++){
    const s = (emp.schedule&&emp.schedule[d])||'W';
    if(s==='W') wk++;
    else if(s==='OFF') off++;
    else if(s==='REQ_OFF') reqOff++;
    else if(s==='HALF'){ half++; wk+=0.5; }
  }
  const actualOff = off + reqOff + half*0.5;
  const tueCount = countWeekdayInMonth(m.year, m.month, 2);

  if(emp.type==='regular'){
    const holidaysAdded = parseFloat(m.holidaysAdded||0)||0;
    const phCarry = parseFloat(emp.phCarry||0)||0;
    const phTotal = phCarry + holidaysAdded;
    const vacUsed = Math.max(0, actualOff - tueCount);
    const phRemain = phTotal - vacUsed;
    return {wk, off, half, reqOff, actualOff, tueCount, holidaysAdded, phCarry,
            phTotal, phRemain, vacUsed, auto:true};
  }
  // Non-regular: keep stored values
  return {wk, off, half, reqOff, actualOff, tueCount,
          phTotal: emp.phTotal||'', phRemain: emp.phRemain||'',
          vacUsed: emp.vacUsed||'', auto:false};
}

function fmtNum(n){
  if(n===''||n==null) return '';
  if(typeof n==='string') return n;
  // strip trailing .0
  return String(+(+n).toFixed(2));
}

async function syncFromCloud(){
  setSync('syncing');
  try{
    const rows = await cloudList();
    if(!rows.length){
      // First-time bootstrap — push local data up
      for(const k of Object.keys(data)) await cloudUpsert(k, data[k]);
    }else if(isDirty){
      // Don't overwrite unsaved local changes — keep local, log it
      console.info('Local has unsaved changes — skipping cloud overwrite. Press 💾 to push.');
      showToast('⚠ มีข้อมูลที่ยังไม่บันทึก กดปุ่ม 💾 เพื่ออัพโหลด');
    }else{
      const cloudData = {};
      rows.forEach(r => cloudData[r.key] = r.data);
      ensurePositionField(cloudData);
      ensureSalaryField(cloudData);
      ensureExpensesField(cloudData);
      ensureAdvancesField(cloudData);
      migrateToHolidayModel(cloudData);
      data = cloudData;
      saveLocal();
      const ks = sorted();
      if(!data[curKey]) curKey = ks[ks.length-1] || curKey;
      render();
    }
    setSync('ok');
  }catch(e){ console.error('sync',e); setSync('error'); }
}

function tap(ei,d){
  if(locked){ showToast('🔒 ปลดล็อกก่อน (กดปุ่ม 🔒 ด้านบน)'); return; }
  const m=data[curKey]; if(!m) return;
  const emp=m.employees[ei]; if(!emp) return;
  if(!emp.schedule) emp.schedule={};
  // Long-press detection isn't great on mobile; offer time-entry edit via separate button
  emp.schedule[d]=CYCLE[emp.schedule[d]||'W']||'W';
  saveLocal(); markDirty();
  const ph=new Set(m.publicHolidays||[]);
  const s=emp.schedule[d];
  const w=dow(m.year,m.month,d), wknd=w===0||w===6, isPH=ph.has(d);
  const cell=document.querySelector(`tr[data-ei="${ei}"] td.dc[onclick="tap(${ei},${d})"]`);
  if(cell){
    cell.className=`dc ${s}${wknd?' wknd':''}${isPH?' pub-h':''}`;
    cell.textContent=STATE_LBL[s]||'';
  }
  updateRowTotals(ei);
}

function updateRowTotals(ei){
  const m=data[curKey]; const emp=m.employees[ei]; if(!emp) return;
  const st = deriveEmpStats(emp, m);
  const wEl=document.getElementById(`wk-${ei}`);
  const oEl=document.getElementById(`of-${ei}`);
  const vEl=document.getElementById(`vc-${ei}`);
  const ptEl=document.getElementById(`pht-${ei}`);
  const prEl=document.getElementById(`phr-${ei}`);
  if(wEl) wEl.textContent = fmtNum(st.wk);
  if(oEl) oEl.textContent = fmtNum(st.actualOff);
  if(st.auto){
    if(vEl) vEl.textContent = fmtNum(st.vacUsed);
    if(ptEl) ptEl.textContent = fmtNum(st.phTotal);
    if(prEl) prEl.textContent = fmtNum(st.phRemain);
  }
}

  const days=new Date(y,mo,0).getDate();

  const emps = (lastMonth && lastMonth.employees||[]).filter(e=>e.name).map(e=>{

// ═══════════════════ SUMMARY ═══════════════════
// ═══════════════════ CROSS-EMPLOYEE DAILY REPORT ═══════════════════
let _reportFrom = null;  // ISO yyyy-mm-dd
let _reportTo = null;    // ISO yyyy-mm-dd

function isoToday(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isoFromDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function daysBetween(from, to){
  const a = new Date(from), b = new Date(to);
  return Math.round((b - a) / 86400000) + 1;
}
function addDaysIso(iso, n){
  const d = new Date(iso);
  d.setDate(d.getDate()+n);
  return isoFromDate(d);
}

function addHoursToTimeStr(timeStr, hours){
  if(!timeStr) return '';
  const [h, m] = timeStr.split(':').map(Number);
  const totalMin = h*60 + m + hours*60;
  const wrapped = ((totalMin % (24*60)) + 24*60) % (24*60);
  return `${String(Math.floor(wrapped/60)).padStart(2,'0')}:${String(wrapped%60).padStart(2,'0')}`;
}

// Compute OT/work time from periods (mirrors clock.html computeOtFromPeriods)
function computeOtFromPeriodsMain(periods, isOffDay){
  let rawMin = 0;
  (periods||[]).forEach(p=>{
    if(!p.in||!p.out) return;
    const [h1,m1]=p.in.split(':').map(Number);
    const [h2,m2]=p.out.split(':').map(Number);
    let mins=(h2*60+m2)-(h1*60+m1);
    if(mins<0) mins+=24*60;
    rawMin += Math.max(0,mins);
  });
  if(isOffDay) return {totalMin:0, otMin:rawMin, rawMin};
  let totalMin=0;
  (periods||[]).forEach(p=>{
    if(!p.in||!p.out) return;
    const [h1,m1]=p.in.split(':').map(Number);
    const [h2,m2]=p.out.split(':').map(Number);
    let mins=(h2*60+m2)-(h1*60+m1);
    if(mins<0) mins+=24*60;
    const workMin = mins>=540 ? mins-60 : mins;
    totalMin += Math.max(0,workMin);
  });
  return {totalMin, otMin:Math.max(0,totalMin-480), rawMin};
}

// Dedicated A4 portrait PDF export for the report card — paginates if content overflows
async function exportReportPdfPortrait(fname){
  const node = document.getElementById('report-card'); if(!node) return;
  if(!window.jspdf){ showToast('⚠ jspdf ไม่พร้อม'); return; }
  showToast('⏳ กำลังสร้าง PDF...');
  try{
    const canvas = await html2canvas(node, {backgroundColor:'#fff', scale:2.2, useCORS:true, allowTaint:true, logging:false});
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({orientation:'portrait', unit:'pt', format:'a4'});
    const pageW = pdf.internal.pageSize.getWidth();   // 595pt
    const pageH = pdf.internal.pageSize.getHeight();  // 842pt
    const margin = 20;
    const usableW = pageW - margin*2;
    const usableH = pageH - margin*2;

    const cw = canvas.width, ch = canvas.height;
    const scale = usableW / cw;
    const drawW = usableW;
    const drawH = ch * scale;

    if(drawH <= usableH){
      pdf.addImage(canvas.toDataURL('image/png'),'PNG', margin, margin, drawW, drawH);
    } else {
      // Paginate vertically
      const sliceH = usableH / scale;  // source pixels per page
      let y = 0;
      while(y < ch){
        const curSliceH = Math.min(sliceH, ch - y);
        const slice = document.createElement('canvas');
        slice.width = cw; slice.height = curSliceH;
        const ctx = slice.getContext('2d');
        ctx.drawImage(canvas, 0, y, cw, curSliceH, 0, 0, cw, curSliceH);
        if(y > 0) pdf.addPage('a4','portrait');
        pdf.addImage(slice.toDataURL('image/png'),'PNG', margin, margin, drawW, curSliceH * scale);
        y += sliceH;
      }
    }
    pdf.save(`รายงาน-${fname}.pdf`);
    showToast('📄 บันทึก PDF แล้ว (A4 แนวตั้ง)');
  }catch(e){ console.error(e); showToast('⚠ '+(e.message||'').slice(0,80)); }
}
function shiftReportRange(direction){
  const numDays = daysBetween(_reportFrom, _reportTo);
  _reportFrom = addDaysIso(_reportFrom, direction * numDays);
  _reportTo = addDaysIso(_reportFrom, numDays-1);
  renderReportTab();
}

// Helper: does an employee have a work entry for that day?
// Counts EITHER assigned work_start OR recorded periods — unified with clock.html report
function hasWorkEntry(entry){
  return !!(entry && (entry.work_start || (entry.periods && entry.periods.length>0)));
}

      if(has && !isOffDay) daysWorked++;

        </tr>
      </tfoot>
    </table>
    <p class="no-export" style="text-align:center;font-size:10px;color:#aaa;margin-top:10px;">⏱ ข้อมูลล่าสุด: ${new Date().toLocaleTimeString('th-TH')}</p>
  </div>`;

  // Action buttons (outside the report card so they don't appear in export)
  html += `<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
    <button class="btn-sec" onclick="refreshPayroll()" style="flex:0 0 auto;padding:8px 14px;">🔄 โหลดล่าสุด</button>
    <button class="btn-pri" onclick="exportPayrollPNG()" style="flex:1;min-width:120px;">📷 บันทึกรูป</button>
    <button class="btn-pri" onclick="exportPayrollPDF()" style="flex:1;min-width:120px;">📄 บันทึก PDF</button>
  </div>`;

  // Notes
  html += `<div class="sum-card"><div class="sum-card-hd">ℹ️ กติกาคำนวณ</div>
    <div style="padding:12px;font-size:12px;line-height:1.7;color:#5d4037;">
      • <strong>วันทำงาน</strong> = วันที่ schedule = W/HALF <strong>และ</strong> มีลงเวลา (ไม่นับวันหยุด)<br>
      • <strong>ค่าใช้จ่ายประจำ</strong> = รายการคงที่ของเดือน (ไม่เกี่ยวกับตาราง/ลงเวลา) ลำดับต่อจากพนักงาน · แตะ ✏ แก้ ปุ่ม 🗑 ลบ<br>
      • <strong>เบิก (เบิกล่วงหน้า)</strong> = แตะช่องเพื่อจัดการเงินเบิก · หักจาก สุทธิ ทันทีในเดือนเดียวกัน · ไม่ยกข้ามเดือน<br>
      • <strong>วันหยุด</strong> = OFF + รีเควสต์ตามตาราง (รวมวันที่มา OT พิเศษด้วย)<br>
      • <strong>(OT พิเศษ N)</strong> = วันหยุดที่พนักงานมาทำงาน → คิดเป็น OT 100% (ไม่นับเป็นวันทำงาน)<br>
      • <strong>เงินเดือนประจำ</strong>: ฐานคงที่เต็มเดือน ไม่หักขาด<br>
      • <strong>รายวัน (พาสไทม์/ฝึกงาน)</strong>: ฐาน = ค่าจ้าง × วันทำงาน<br>
      • <strong>ค่า OT</strong> = (OT นาทีรวม ÷ 60) × <strong>${OT_RATE_PER_HOUR} บาท/ชม.</strong><br>
      • วัน OFF + OT: ทุกนาทีคิดเป็น OT (ไม่หักพักเที่ยง ไม่ลบ 8 ชม.)<br>
      • วัน W/HALF + OT: หักพักเที่ยง 1 ชม. ถ้าช่วงเดียวยาว ≥ 9 ชม. (ถ้าหลายช่วงไม่หัก)<br>
      • <strong>รวม</strong> = เงินเดือน + ค่า OT (ไม่มีหักลด) · ซิงค์กับ clock.html
    </div>
  </div>`;

  // Save data for export functions
  window._payrollRows = rows;
  window._payrollMonth = m;
  document.getElementById('payroll-view').innerHTML = html;
}

function fmt$(n){
  return Number(n||0).toLocaleString('th-TH', {maximumFractionDigits:2});
}

function addAdvance(empName){
  const date = document.getElementById('adv-date').value;

  const note = document.getElementById('adv-note').value.trim();
  if(!date){ alert('เลือกวันที่'); return; }

  saveLocal(); markDirty();
  renderAdvancesModal(empName);
  renderPayroll();
  showToast('ลบแล้ว');
}

async function exportNodeAsPdf(nodeId, fname){
  const node = document.getElementById(nodeId); if(!node) return;
  if(!window.jspdf){ showToast('⚠ jspdf ไม่พร้อม'); return; }
  showToast('⏳ กำลังสร้าง PDF...');
  const canvas = await html2canvas(node, {backgroundColor:'#fff', scale:2, useCORS:true, allowTaint:true, logging:false});
  const {jsPDF} = window.jspdf;
  const w = canvas.width, h = canvas.height;
  const orient = w>h ? 'landscape' : 'portrait';
  const pdf = new jsPDF({orientation:orient, unit:'pt', format:'a4'});
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const margin = 24;
  const scale = Math.min((pageW-margin*2)/w, (pageH-margin*2)/h);
  const drawW = w*scale, drawH = h*scale;
  pdf.addImage(canvas.toDataURL('image/png'),'PNG', (pageW-drawW)/2, (pageH-drawH)/2, drawW, drawH);
  pdf.save(fname);
  showToast('📄 บันทึก PDF แล้ว');
}

async function renderSummary(){
  const m=data[curKey]; if(!m) return;
  const el = document.getElementById('summary-view');
  el.innerHTML = `<p style="text-align:center;color:#888;padding:20px;">⏳ กำลังโหลด...</p>`;

  // Load time entries fresh
  invalidateTimeEntriesCache(curKey);
  const entries = await loadTimeEntries(curKey);

  // Per-employee stats
  const emps = m.employees.filter(e=>e.name);
  const stats = emps.map(emp=>{
    let workMin=0, otMin=0, daysWorked=0, daysOff=0, daysOtSpecial=0, daysHalf=0;
    let earliestStart='', latestStart='', sumStartMin=0, startCount=0;
    for(let d=1; d<=m.days; d++){
      const sched = (emp.schedule||{})[d]||'W';
      const isOffDay = sched==='OFF' || sched==='REQ_OFF';
      const isHalf = sched==='HALF';
      const entry = entries[`${emp.name}|${d}`];
      const periods = entry?.periods||[];
      const has = !!(entry && (entry.work_start || periods.length));
      if(isOffDay) daysOff++;
      if(isHalf) daysHalf++;
      if(has && !isOffDay){
        daysWorked++;
        const s = computeOtFromPeriodsMain(periods, false);
        workMin += s.totalMin;
        // Track arrival pattern
        if(entry.work_start){
          const [h,mm] = entry.work_start.split(':').map(Number);
          const startMin = h*60+mm;
          sumStartMin += startMin;
          startCount++;
          if(!earliestStart || startMin < (parseInt(earliestStart.split(':')[0])*60+parseInt(earliestStart.split(':')[1]))) earliestStart = entry.work_start;
          if(!latestStart || startMin > (parseInt(latestStart.split(':')[0])*60+parseInt(latestStart.split(':')[1]))) latestStart = entry.work_start;
        }
      }
      if(has && isOffDay) daysOtSpecial++;
      if(entry) otMin += (+entry.ot_min||0);
    }
    const salary = parseFloat(emp.salary)||0;
    const su = emp.salaryUnit || (emp.type==='regular'?'month':'day');
    const basePay = (su==='month') ? salary : salary * daysWorked;
    const otPay = (otMin/60) * OT_RATE_PER_HOUR;
    const total = basePay + otPay;
    const avgStart = startCount ? Math.round(sumStartMin/startCount) : null;
    const avgStartStr = avgStart!==null ? `${String(Math.floor(avgStart/60)).padStart(2,'0')}:${String(avgStart%60).padStart(2,'0')}` : '—';
    return {emp, daysWorked, daysOff, daysOtSpecial, daysHalf, workMin, otMin, basePay, otPay, total, avgStart, avgStartStr, earliestStart, latestStart};
  });

  // Aggregate totals
  const totalWorkMin = stats.reduce((s,r)=>s+r.workMin,0);
  const totalOtMin = stats.reduce((s,r)=>s+r.otMin,0);
  const totalBasePay = stats.reduce((s,r)=>s+r.basePay,0);
  const totalOtPay = stats.reduce((s,r)=>s+r.otPay,0);
  const totalPay = totalBasePay + totalOtPay;

  // Find highlights
  const sortedWork = [...stats].sort((a,b)=>b.workMin-a.workMin);
  const sortedOt = [...stats].sort((a,b)=>b.otMin-a.otMin);
  const sortedDays = [...stats].sort((a,b)=>b.daysWorked-a.daysWorked);
  const sortedEarly = [...stats].filter(s=>s.avgStart!==null).sort((a,b)=>a.avgStart-b.avgStart);
  const topWork = sortedWork[0];
  const topOt = sortedOt.find(s=>s.otMin>0);
  const topDays = sortedDays[0];
  const earliestArriver = sortedEarly[0];

  // Groups summary
  const groups = m.groups||{};
  const grpEntries = {}; // {name: [days]}
  Object.entries(groups).forEach(([day,g])=>{
    const gName = (typeof g === 'string') ? g : (g?.name||'');
    if(!gName) return;
    if(!grpEntries[gName]) grpEntries[gName]=[];
    grpEntries[gName].push(parseInt(day));
  });
  const grpList = Object.entries(grpEntries).map(([n,days])=>{
    days.sort((a,b)=>a-b);
    return `<span style="display:inline-block;background:#fff3e0;color:#5d4037;padding:3px 8px;border-radius:12px;margin:2px;font-size:11px;font-weight:600;">${esc(n)} <span style="color:#888;font-size:10px;">(${days.length===1?days[0]:days.join(',')})</span></span>`;
  }).join('');

  // ── BUILD HTML ──
  let html = '';

  // Title + month + note
  html += `<div style="margin-bottom:10px;">
    <h2 style="font-size:18px;font-weight:800;color:#c44a1f;">📊 สรุปประจำเดือน ${m.label}</h2>
    ${m.note?`<p style="font-size:12px;color:#8b4513;margin-top:4px;">${esc(m.note)}</p>`:''}
  </div>`;

  // Dashboard cards
  html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
    <div style="background:linear-gradient(135deg,#fde8d8 0%,#fce4ec 100%);padding:14px;border-radius:10px;text-align:center;">

      <div style="font-size:28px;font-weight:800;color:#2e7d32;line-height:1;">${(totalWorkMin/60).toFixed(0)}</div>
      <div style="font-size:11px;color:#2e7d32;margin-top:4px;">💼 ชั่วโมงทำงานรวม</div>

      <div style="font-size:22px;font-weight:800;color:#c44a1f;line-height:1.1;">฿${fmt$(totalPay)}</div>
      <div style="font-size:11px;color:#8b4513;margin-top:4px;">💰 ค่าจ้างรวม</div>
    </div>
  </div>`;

  // Highlights
  html += `<div style="background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid #fde8d8;">
    <h3 style="font-size:14px;font-weight:800;color:#c44a1f;margin-bottom:10px;">🏆 ของเด็ดประจำเดือน</h3>
    <div style="display:flex;flex-direction:column;gap:10px;">`;
  if(topWork && topWork.workMin>0){
    html += `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#e8f5e9;border-radius:8px;">
      <span style="font-size:22px;">🥇</span>
      <div style="flex:1;">

      </div>

  if(topOt){
    html += `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff3c4;border-radius:8px;">

  if(topDays && topDays!==topWork && topDays.daysWorked>0){

      <span style="font-size:22px;">📅</span>

async function delMonth(k){
  if(!confirm(`ลบเดือน "${data[k].label}"?`)) return;
  delete data[k];
  saveLocal();
  try{ await cloudDelete(k); }catch(e){ console.error(e); }
  const ks=sorted(); if(ks.length) curKey=ks[ks.length-1];
  render(); renderManage(); showToast('ลบแล้ว');
}
function delEmp(ei){
  if(locked){ showToast('🔒 ปลดล็อกก่อน'); return; }
  const e=data[curKey].employees[ei];
  if(!confirm(`ลบ "${e.name}"?`)) return;
  data[curKey].employees.splice(ei,1);
  saveLocal(); markDirty(); render(); renderManage(); showToast('ลบพนักงานแล้ว');
}

// Move employee up/down — swaps positions of named employees only
function moveEmp(ei, dir){
  if(locked){ showToast('🔒 ปลดล็อกก่อน'); return; }
  const m = data[curKey]; if(!m) return;
  const arr = m.employees;
  // Find prev/next NAMED index (skip blank rows)
  let target = ei + dir;
  while(target>=0 && target<arr.length && !arr[target].name){
    target += dir;
  }
  if(target<0 || target>=arr.length) return;
  [arr[ei], arr[target]] = [arr[target], arr[ei]];
  saveLocal(); markDirty(); render(); renderManage();
}
async function resetAll(){
  if(!confirm('รีเซ็ตข้อมูลทั้งหมด? การแก้ไขจะหายไป')) return;
  data=clone(EXCEL); ensurePositionField(data); ensureSalaryField(data); ensureExpensesField(data); ensureAdvancesField(data); migrateToHolidayModel(data);
  saveLocal();
  await pushAllNow();
  render(); renderManage();
}

// ═══════════════════ EXPORT ═══════════════════
function isMobile(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }

// Modify-restore pattern: temporarily strip sticky/overflow from real DOM,
// capture, then restore. Much more reliable than offscreen clone.
async function captureTable(){
  if(typeof html2canvas==='undefined'){
    showToast('⚠ html2canvas ไม่พร้อม — เช็คเน็ตและรีโหลด'); return null;
  }
  showToast('⏳ กำลังสร้างรูป...');

  // Switch to schedule view so table is rendered
  const wasView = curView;
  if(wasView!=='schedule'){ switchView('schedule'); await new Promise(r=>setTimeout(r,80)); }

  // Apply exporting class — strips sticky, overflow, hides chrome
  document.body.classList.add('exporting');
  // Force reflow
  await new Promise(r=>setTimeout(r,80));

  const frame = document.getElementById('tbl-frame');
  const w = frame.scrollWidth;
  const h = frame.scrollHeight;

  try{
    const canvas = await html2canvas(frame, {
      backgroundColor:'#fffdf5',
      scale: 2.5,
      width: w, height: h,
      windowWidth: Math.max(w + 60, 800),
      windowHeight: Math.max(h + 60, 600),
      useCORS:true, allowTaint:true, logging:false,
      scrollX:0, scrollY:0, x:0, y:0,
      imageTimeout: 0,
    });
    return canvas;
  }finally{
    document.body.classList.remove('exporting');
    if(wasView!=='schedule') switchView(wasView);
  }
}

async function exportPNG(){
  try{
    const canvas = await captureTable(); if(!canvas) return;
    const label = (data[curKey]&&data[curKey].label)||'schedule';
    const fname = `ตารางพนักงาน-${label}.png`;

    canvas.toBlob(async (blob)=>{
      if(!blob){ showToast('⚠ สร้างรูปไม่สำเร็จ'); return; }
      // Try Web Share API (mobile-friendly)
      if(isMobile() && navigator.share && navigator.canShare){
        const file = new File([blob], fname, {type:'image/png'});
        if(navigator.canShare({files:[file]})){
          try{
            await navigator.share({files:[file], title:label, text:'ตารางพนักงาน '+label});
            showToast('📷 พร้อมแชร์'); return;
          }catch(e){ if(e.name==='AbortError') return; }
        }
      }
      // Fallback: download
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download=fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      showToast('📷 บันทึกรูปแล้ว');
    },'image/png', 0.95);
  }catch(e){ console.error(e); showToast('⚠ บันทึกรูปไม่สำเร็จ: '+e.message); }
}

async function exportPDF(){
  try{
    const canvas = await captureTable(); if(!canvas) return;
    if(!window.jspdf){ showToast('⚠ jspdf ไม่พร้อม'); return; }
    const {jsPDF} = window.jspdf;

    const w = canvas.width, h = canvas.height;
    // Always landscape for wide schedule
    const pdf = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 14;
    const usableW = pageW - margin*2;
    const usableH = pageH - margin*2;

    // Fit to width, paginate vertically if too tall
    const scale = usableW / w;
    const drawW = usableW;
    const drawH = h * scale;

    if(drawH <= usableH){
      const imgData = canvas.toDataURL('image/png');
      pdf.addImage(imgData,'PNG', margin, margin + (usableH-drawH)/2, drawW, drawH);
    }else{
      // Slice canvas into page-height chunks
      const sliceH = usableH / scale; // source pixels per page
      let y = 0;
      while(y < h){
        const curSliceH = Math.min(sliceH, h - y);
        const slice = document.createElement('canvas');
        slice.width = w; slice.height = curSliceH;
        const ctx = slice.getContext('2d');
        ctx.drawImage(canvas, 0, y, w, curSliceH, 0, 0, w, curSliceH);
        const imgData = slice.toDataURL('image/png');
        if(y>0) pdf.addPage('a4','landscape');
        pdf.addImage(imgData,'PNG', margin, margin, drawW, curSliceH * scale);
        y += sliceH;
      }
    }

    const label = (data[curKey]&&data[curKey].label)||'schedule';
    pdf.save(`ตารางพนักงาน-${label}.pdf`);
    showToast('📄 บันทึก PDF แล้ว');
  }catch(e){ console.error(e); showToast('⚠ บันทึก PDF ไม่สำเร็จ: '+e.message); }
}
